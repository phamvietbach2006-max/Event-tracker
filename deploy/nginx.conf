# /etc/nginx/sites-available/event-tracker
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name sk.dyclub.tech sk.hust.edu.vn _;

  root /opt/event-tracker/web;
  index index.html;
  client_max_body_size 64k;

  # API, đăng nhập: chuyển cho Node
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /auth/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # SSE: tắt buffer, giữ kết nối dài
  location /events {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Giao diện React (web/dist): file tĩnh, các đường dẫn khác về index.html
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
