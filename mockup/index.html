<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mockup – Theo dõi sự kiện</title>
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#161b26;--mute:#667085;--line:#e4e7ec;--brand:#1f3a8a;
--red:#c0262d;--yellow:#b45309;--green:#0f7b45;--gray:#667085;
--red-bg:#fde4e4;--yellow-bg:#fdf0d5;--green-bg:#dff5e8;--gray-bg:#eef0f4}
@media(prefers-color-scheme:dark){:root{--bg:#0e1118;--card:#171b25;--ink:#eef0f5;--mute:#98a1b3;--line:#273041;--brand:#8ea6ff;
--red:#ff7b7f;--yellow:#f2b84b;--green:#4cc98b;--gray:#9aa3b5;
--red-bg:#3d1a1c;--yellow-bg:#3a2e12;--green-bg:#12301f;--gray-bg:#222938}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{font-size:17px;margin:0;font-weight:700}
.live{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:p 2s infinite}
@keyframes p{50%{opacity:.35}}
.who{font-size:13px;color:var(--mute);margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tile{border:2px solid transparent;border-radius:12px;padding:8px 4px;text-align:center;background:var(--bg-c);cursor:pointer;min-height:60px}
.tile b{display:block;font-size:24px;line-height:1.1;color:var(--c)}
.tile span{font-size:12px;color:var(--c);font-weight:600}
.tile.on{border-color:var(--c)}
.total{margin-top:10px;font-size:12px;color:var(--mute);display:flex;justify-content:space-between}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}.bar b{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:9px 14px;min-height:40px;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:8px 16px;display:grid;gap:14px}
.red{--c:var(--red);--bg-c:var(--red-bg)}.yellow{--c:var(--yellow);--bg-c:var(--yellow-bg)}.green{--c:var(--green);--bg-c:var(--green-bg)}
.todo{--c:var(--gray);--bg-c:var(--gray-bg)}.doing{--c:var(--yellow);--bg-c:var(--yellow-bg)}.done{--c:var(--green);--bg-c:var(--green-bg)}
.grp{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gh{width:100%;background:none;border:0;text-align:left;padding:14px;display:grid;gap:10px;cursor:pointer}
.gt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gname{font-size:18px;font-weight:800}.gsum{font-size:13px;color:var(--mute)}
.gchev{transition:transform .2s;font-size:18px}.grp.open .gchev{transform:rotate(180deg)}
.tags{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 10px;border-radius:12px;border:2px solid var(--c);background:var(--bg-c);font-size:14px;font-weight:600;line-height:1.2}
.tag i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.grp.open .tags{display:none}
.kids{display:none;padding:0 12px 12px;gap:10px}.grp.open .kids{display:grid}
.kid{border:1px solid var(--line);border-left:8px solid var(--c);border-radius:12px;background:var(--card);overflow:hidden}
.kid.flash{animation:f 1.6s}@keyframes f{0%{box-shadow:0 0 0 3px var(--brand)}100%{box-shadow:0 0 0 0 transparent}}
.head{width:100%;background:none;border:0;text-align:left;padding:12px;display:grid;gap:6px;cursor:pointer;min-height:72px}
.t1{display:flex;justify-content:space-between;gap:8px;align-items:start}
.name{font-weight:700;font-size:17px}
.pill{flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--bg-c);color:var(--c)}
.line{font-size:15px}.line.empty{color:var(--mute)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute)}
.chev{transition:transform .2s}.kid.open .chev{transform:rotate(180deg)}
.body{display:none;padding:0 12px 12px}.kid.open .body{display:block}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:12px;min-height:48px;font-weight:700;font-size:13px;cursor:pointer;padding:0 4px}
.seg button.on{border-color:var(--c);background:var(--bg-c);color:var(--c)}
.task{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid var(--line)}
.task span.tx{flex:1}
.task.done span.tx{text-decoration:line-through;color:var(--mute)}
.ts{flex:none;min-width:104px;min-height:44px;border-radius:10px;border:2px solid var(--c);background:var(--bg-c);color:var(--c);font-weight:700;font-size:13px;cursor:pointer}
.ts:disabled{opacity:.75;cursor:default}
.ctl{display:flex;gap:8px;margin-top:10px}
.ctl input{flex:1;min-height:44px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:0 12px;font:inherit;min-width:0}
.ctl button{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.cnt{font-size:12px;color:var(--mute);text-align:right;margin-top:2px}
.lock{font-size:13px;color:var(--mute);margin-top:8px}
.demo{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:20}
.demo small{display:block;text-align:center;color:var(--mute);font-size:11px;margin-bottom:6px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.roles button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;cursor:pointer}
.roles button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
@media(prefers-color-scheme:dark){.roles button.on{color:#0e1118}}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;transition:transform .3s;max-width:92vw}
.toast.show{transform:translate(-50%,0)}
@media(min-width:900px){main{grid-template-columns:repeat(3,1fr);align-items:start}.tags{grid-template-columns:1fr}}
</style></head><body>
<header>
  <div class="row"><h1>Sự kiện – tình trạng các khu vực</h1><div class="live"><i></i>Realtime</div></div>
  <div class="who" id="who"></div>
  <div class="tiles" id="tiles"></div>
  <div class="total"><span id="tt"></span><span id="tp"></span></div><div class="bar"><b id="tb"></b></div>
</header>
<div class="chips" id="chips"></div>
<main id="list"></main>
<div class="demo"><small>Chỉ có ở bản mockup: đổi vai trò để xem giao diện</small><div class="roles" id="roles"></div></div>
<div class="toast" id="toast"></div>
<script>
// 3 màu trạng thái do người phụ trách tự chọn (không tự động). Mặc định khu mới: red.
const ST={red:'Chưa sẵn sàng',yellow:'Đang chuẩn bị',green:'Sẵn sàng'};
// 3 trạng thái của từng việc trong checklist
const TS={todo:'○ Chưa làm',doing:'◐ Đang làm',done:'● Xong'};
const NOTE_MAX=150;
const mk=(id,name,status,owners,line,tasks)=>({id,name,status,owners,note:line,at:'21:'+(10+id*3),tasks:tasks.map((x,i)=>({id:id*100+i,text:x[0],state:x[1]}))});
let G=[
 {id:1,name:'Khối Thư viện TQB',rooms:[
  mk(1,'Sảnh thư viện','yellow',['Phạm Thị D'],'Đang dựng backdrop',[['Dựng backdrop','doing'],['Bàn đón tiếp','done'],['Biển chỉ dẫn','done']]),
  mk(2,'Phòng đọc tầng 2','green',['Trần Văn C'],'Sẵn sàng',[['Bàn ghế, nước','done'],['Máy chiếu, Wi-Fi','done']]),
  mk(3,'Khu triển lãm','red',['Hoàng Văn E'],'Chưa nhận mặt bằng',[['Nhận mặt bằng','todo'],['Dựng panel','todo'],['Ánh sáng','todo']])]},
 {id:2,name:'Khối C2',rooms:[
  mk(4,'Hội trường C2','yellow',['Nguyễn Văn A','Lê Thị B'],'Chờ chạy thử máy chiếu LED',[['Sắp xếp 600 ghế','done'],['Âm thanh, micro','done'],['Chạy thử máy chiếu LED','doing'],['Ánh sáng sân khấu','todo'],['Backdrop, standee','done'],['Nhân sự trực có mặt','todo']]),
  mk(5,'Sảnh C2','red',['Nguyễn Văn A'],'Thiếu 200 thẻ đại biểu, đang in lại',[['Dựng bàn đón tiếp','done'],['In và xếp thẻ đại biểu','doing'],['Bảng chỉ dẫn','done'],['Quầy gửi đồ','todo']]),
  mk(6,'Phòng họp C2-1','green',['Trần Văn C'],'Sẵn sàng',[['Bàn ghế, nước','done'],['Máy chiếu, Wi-Fi','done']]),
  mk(7,'Phòng VIP','yellow',['Phạm Thị D'],'Đang bày hoa',[['Bàn trà, hoa','done'],['Khu chụp ảnh','doing'],['Danh sách VIP bản in','done']]),
  mk(8,'Phòng điều hành','red',['Lê Thị B'],'Chưa bắt đầu',[['Màn hình giám sát','todo'],['Bộ đàm','todo']])]},
 {id:3,name:'Khối Sân trường – An ninh',rooms:[
  mk(9,'Cổng chính','yellow',['Đỗ Văn G'],'An ninh đã vào vị trí 1/2 ca',[['Rào chắn, lối vào','done'],['Bảo vệ ca 1','done'],['Bảo vệ ca 2','doing']]),
  mk(10,'Khu giữ xe','red',['Đỗ Văn G'],'Chưa phân khu',[['Phân khu xe máy, ô tô','todo'],['Biển chỉ dẫn','todo']]),
  mk(11,'Khu ăn nhẹ','yellow',['Vũ Thị H'],'Chờ đồ ăn lúc 10h',[['Bàn buffet','done'],['Nhận đồ ăn lúc 10h','doing'],['Ly, đĩa, rác','todo']]),
  mk(12,'Phòng y tế','green',['Bùi Văn K'],'Sẵn sàng',[['Thuốc, dụng cụ sơ cứu','done'],['Nhân viên y tế','done']])]}
];
const ME={name:'Nguyễn Văn A',rooms:[4,5]};
const ALL=()=>G.flatMap(x=>x.rooms);
const ORDER=Object.keys(ST);
let role=localStorage.getItem('role')||'guest',filter='all',openG=new Set(G.map(g=>g.id)),openK=new Set();
const $=id=>document.getElementById(id);
const can=r=>role==='admin'||(role==='owner'&&ME.rooms.includes(r.id));
const nDone=r=>r.tasks.filter(x=>x.state==='done').length;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
function kid(r,flash){
  const dn=nDone(r),pc=r.tasks.length?Math.round(dn/r.tasks.length*100):0,ed=can(r);
  return `<section class="kid ${r.status} ${openK.has(r.id)?'open':''} ${flash===r.id?'flash':''}">
   <button class="head" onclick="togK(${r.id})"><div class="t1"><span class="name">${r.name}</span><span class="pill">${ST[r.status]}</span></div>
   <div class="line ${r.note?'':'empty'}">${r.note||'Chưa có cập nhật'}</div>
   <div class="meta"><span>${r.owners.join(', ')} · ${dn}/${r.tasks.length} việc · ${pc}%</span><span class="chev">▾</span></div></button>
   <div class="body">
    <div class="bar" style="margin:0 0 10px"><b style="width:${pc}%;background:var(--c)"></b></div>
    ${ed?`<div class="seg">${ORDER.map(k=>`<button class="${k} ${r.status===k?'on':''}" onclick="setS(${r.id},'${k}')">${ST[k]}</button>`).join('')}</div>`:''}
    ${r.tasks.map(x=>`<div class="task ${x.state}"><span class="tx">${x.text}</span><button class="ts ${x.state}" ${ed?'':'disabled'} onclick="cyc(${r.id},${x.id})">${TS[x.state]}</button></div>`).join('')}
    ${ed?`<div class="ctl"><input maxlength="${NOTE_MAX}" placeholder="Dòng status ngắn (tối đa ${NOTE_MAX} ký tự)" value="${r.note}" onchange="note(${r.id},this.value)">${role==='admin'?'<button onclick="toast(\'(mockup) Thêm việc\')">+ Việc</button>':''}</div>`:`<div class="lock">🔒 ${role==='guest'?'Đăng nhập để cập nhật':'Chỉ người phụ trách mới sửa được'}</div>`}
    <div class="lock">Cập nhật lúc ${r.at}</div></div></section>`}
function render(flash){
  const cnt={red:0,yellow:0,green:0};let d=0,t=0;
  ALL().forEach(r=>{cnt[r.status]++;t+=r.tasks.length;d+=nDone(r)});
  $('who').textContent=role==='guest'?'Bạn đang xem công khai · Chưa đăng nhập':role==='owner'?'Xin chào '+ME.name+' · Phụ trách 2 khu vực':'Quản trị viên · Sửa được tất cả';
  $('tiles').innerHTML=ORDER.map(k=>`<button class="tile ${k} ${filter===k?'on':''}" onclick="setF('${k}')"><b>${cnt[k]}</b><span>${ST[k]}</span></button>`).join('');
  $('tt').textContent=`${ALL().length} khu · ${d}/${t} việc xong`;$('tp').textContent=Math.round(d/t*100)+'%';$('tb').style.width=d/t*100+'%';
  $('chips').innerHTML=(role==='guest'?'<button class="chip" onclick="toast(\'(mockup) Chuyển sang đăng nhập SSO HUST\')">Đăng nhập</button>':'<button class="chip '+(filter==='mine'?'on':'')+'" onclick="setF(\'mine\')">Của tôi</button>')+(role==='admin'?'<button class="chip" onclick="toast(\'(mockup) Mở màn Quản lý\')">⚙ Quản lý</button>':'');
  const pass=r=>filter==='all'||(filter==='mine'?can(r):r.status===filter);
  $('list').innerHTML=G.map(g=>{
    const rs=g.rooms.filter(pass);
    if(!rs.length)return '';
    const c={red:0,yellow:0,green:0};g.rooms.forEach(r=>c[r.status]++);
    const sum=[c.red&&`<b style="color:var(--red)">${c.red} đỏ</b>`,c.yellow&&`<b style="color:var(--yellow)">${c.yellow} vàng</b>`,c.green&&`<b style="color:var(--green)">${c.green} xanh</b>`].filter(Boolean).join(' · ');
    const op=openG.has(g.id);
    return `<section class="grp ${op?'open':''}"><button class="gh" onclick="togG(${g.id})">
      <div class="gt"><span class="gname">${g.name}</span><span class="gchev">▾</span></div><div class="gsum">${g.rooms.length} khu · ${sum}</div>
      <div class="tags">${rs.map(r=>`<span class="tag ${r.status}"><i></i>${r.name}</span>`).join('')}</div></button>
      <div class="kids">${rs.map(r=>kid(r,flash)).join('')}</div></section>`}).join('')||'<p style="color:var(--mute);text-align:center">Không có khu nào</p>';
  $('roles').innerHTML=[['guest','Khách'],['owner','Phụ trách'],['admin','Admin']].map(([k,l])=>`<button class="${role===k?'on':''}" onclick="setR('${k}')">${l}</button>`).join('');
}
const g=id=>ALL().find(r=>r.id===id);
const now=()=>new Date().toTimeString().slice(0,5);
function togG(id){openG.has(id)?openG.delete(id):openG.add(id);render()}
function togK(id){openK.has(id)?openK.delete(id):openK.add(id);render()}
function setF(f){filter=filter===f?'all':f;render()}
function setR(r){role=r;localStorage.setItem('role',r);if(r==='guest'&&filter==='mine')filter='all';render()}
function setS(id,s){g(id).status=s;g(id).at=now();render(id)}
function cyc(id,tid){const r=g(id),x=r.tasks.find(y=>y.id===tid);x.state={todo:'doing',doing:'done',done:'todo'}[x.state];r.at=now();render()}
function note(id,v){g(id).note=v.slice(0,NOTE_MAX);g(id).at=now();render()}
// giả lập realtime: người khác đổi trạng thái một việc (KHÔNG tự đổi màu của khu)
setInterval(()=>{const A=ALL();const r=A[Math.floor(Math.random()*A.length)];const x=r.tasks.find(y=>y.state!=='done');
  if(x){x.state=x.state==='todo'?'doing':'done';r.at=now();toast(`${r.owners[0]}: ${x.text} → ${TS[x.state].slice(2)} (${r.name})`);render(r.id)}},14000);
render();
</script></body></html>
