name: ci-deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiểm tra cú pháp backend
        run: |
          for f in server.js $(find lib routes auth -name '*.js' 2>/dev/null); do node --check "$f"; done
      - name: Backend test (nếu có)
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.test?0:1)"; then
            npm ci && npm test
          else echo "chưa có test"; fi
      - name: Build frontend (nếu có web/)
        run: |
          if [ -f web/package.json ]; then
            cd web && npm ci && npm run build
          else echo "chưa có web/"; fi
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: ignore

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
        continue-on-error: true
      - name: Chuẩn bị SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy
        env:
          HOST: deploy@${{ secrets.DEPLOY_HOST }}
          KEY: /home/runner/.ssh/deploy_key
        run: ./deploy/deploy.sh all
      - name: Kiểm tra sau deploy
        run: |
          sleep 2
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "http://${{ secrets.DEPLOY_HOST }}/api/state" || true)
          echo "GET /api/state -> $code"
          [ "$code" = 200 ]
